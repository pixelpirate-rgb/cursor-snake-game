<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cursor Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <h1>🔐 Login to Play</h1>
    <input type="text" id="user-id" placeholder="Enter ID">
    <input type="password" id="user-pass" placeholder="Enter Password">
    <button id="login-btn">LOGIN</button>
    <p id="login-error"></p>
  </div>
  <!-- Dashboard Screen -->
<div id="dashboard" style="display:none;">
  <h1>📊 Dashboard</h1>
  <p>Highest Score: <span id="highest-score">0</span></p>
  <button id="play-btn">PLAY GAME</button>
</div>


  <!-- Start Screen -->
  <div id="start-screen" style="display: none;">
    <h1>🐍 Cursor Snake</h1>
    <button id="start-btn">START GAME</button>
  </div>

  <!-- Score Board -->
  <div id="score-board" style="display: none;">
    🐍 Score: <span id="score">0</span>
  </div>

  <div id="game" style="display: none;">
    <div id="food"></div>
    <div class="cursor-glow"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
