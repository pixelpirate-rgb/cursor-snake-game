<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cursor Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <h1>🔐 Login</h1>
  <input id="user-id" placeholder="User ID">
  <input id="user-pass" type="password" placeholder="Password">
  <button id="login-btn">Login</button>
  <p id="login-error"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <h1>🎮 Player Dashboard</h1>

  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>Score</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="score-body"></tbody>
  </table>

  <button id="start-btn">Start Game</button>
</div>

<!-- SCORE -->
<div id="score-board">Score: <span id="score">0</span></div>

<!-- GAME -->
<div id="game">
  <div id="food"></div>
  <div class="cursor-glow"></div>
</div>

<script src="script.js"></script>
</body>
</html>
